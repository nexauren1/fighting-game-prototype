name: Godot project check

on:
  push:
    branches: [main]

jobs:
  godot-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false

      - name: Parse project and scripts
        run: godot --headless --path . --editor --quit

      - name: Run main scene briefly
        run: godot --headless --path . --rendering-method gl_compatibility --quit-after 120
